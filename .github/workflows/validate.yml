name: HACS validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  validate-hacs:
    name: Validate dashboard package
    runs-on: ubuntu-latest
    steps:
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: plugin

  validate-files:
    name: Validate JavaScript and package files
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check all dashboard modules
        shell: bash
        run: |
          set -euo pipefail
          for file in dist/*.js; do
            echo "Checking $file"
            node --input-type=module --check < "$file"
          done
      - name: Check package and documentation paths
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re

          root = Path.cwd()
          dist = root / "dist"
          required = [
              "ha-card-collection.js",
              "raumkarte.js", "raumkarte-picker.js",
              "freshairiq-climate-room-card.js", "freshairiq-card-picker.js",
              "shfd-markdown-table-card.js", "shfd-markdown-table-card-picker.js",
          ]
          for name in required:
              file = dist / name
              assert file.is_file() and file.stat().st_size, f"Missing or empty: {file}"
          manifest = json.loads((root / "hacs.json").read_text())
          assert manifest.get("filename") == "ha-card-collection.js", "Wrong HACS entry point"
          assert manifest.get("content_in_root") is False, "Expected dist-based package"
          assert (root / "LICENSE").is_file(), "Missing license"

          import_pattern = r"""(?:versionedUrl|new URL|import)\(\s*["'](\./[^"']+\.js)["']"""
          for file in dist.glob("*.js"):
              for target in re.findall(import_pattern, file.read_text()):
                  assert (file.parent / target).is_file(), f"Missing import: {file}: {target}"

          for language in [root / "docs", root / "docs/de"]:
              for name in ["room-card.md", "freshairiq-climate-room-card.md", "markdown-table-card.md"]:
                  assert (language / name).is_file(), f"Missing documentation: {language / name}"
          for name in ["room-card.png", "climate-card.png", "markdown-table-card.png"]:
              file = root / "docs/images" / name
              assert file.is_file() and file.stat().st_size, f"Missing image: {file}"
          for file in [root / "README.md", *(root / "docs").rglob("*.md")]:
              for target in re.findall(r"\]\(([^)]+)\)", file.read_text()):
                  if re.match(r"[A-Za-z][A-Za-z0-9+.-]*:", target) or target.startswith("#"):
                      continue
                  path = target.split("#", 1)[0]
                  if path:
                      assert (file.parent / path).exists(), f"Broken local link: {file}: {target}"
          print("Package files, local imports and documentation paths checked.")
          PY
